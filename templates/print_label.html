<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Tem Pallet (A4)</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        /* --- GIAO DIỆN MÀN HÌNH --- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f4; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header-nav a { text-decoration: none; color: #555; font-weight: bold; }
        h2 { text-align: center; color: #333; margin: 0 0 20px 0; }
        
        .controls { display: flex; gap: 10px; justify-content: center; background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        select, button { padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; }
        select { min-width: 200px; }
        
        button { color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn-load { background-color: #007bff; }
        .btn-load:hover { background-color: #0056b3; }
        .btn-excel { background-color: #28a745; }
        .btn-excel:hover { background-color: #218838; }
        
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; vertical-align: middle; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        
        .btn-print { background-color: #17a2b8; padding: 6px 12px; font-size: 14px; border-radius: 4px; }
        .btn-print:hover { background-color: #138496; }
        
        .status-printed { color: green; font-weight: bold; }
        .status-pending { color: red; font-weight: bold; }

        /* --- GIAO DIỆN IN ẤN (A4) --- */
        #printArea { display: none; }
        
        @media print {
            @page { size: A4; margin: 0; }
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { 
                display: block; 
                position: absolute; 
                left: 0; top: 0; 
                width: 210mm; 
                height: 297mm; 
                background: white; 
            }
            
            .label-box {
                width: 190mm; 
                height: 277mm;
                margin: 10mm;
                padding: 10mm;
                box-sizing: border-box;
                border: 3px solid #000; /* Viền bao quanh tem */
                display: flex; 
                flex-direction: column;
                font-family: Arial, sans-serif;
                position: relative;
            }
            
            .lbl-header { text-align: center; font-size: 40px; font-weight: 900; border-bottom: 3px solid #000; padding-bottom: 15px; margin-bottom: 20px; }
            .lbl-row { display: flex; justify-content: space-between; font-size: 24px; margin-bottom: 15px; }
            .lbl-barcode { text-align: center; margin: 20px 0; }
            
            .lbl-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 20px; }
            .lbl-table th, .lbl-table td { border: 1px solid #000; padding: 10px; text-align: center; }
            .lbl-table th { background-color: #ddd; font-weight: bold; }
            
            .lbl-footer { margin-top: auto; border-top: 3px solid #000; padding-top: 15px; }
            .lbl-footer-row { display: flex; justify-content: space-between; font-size: 30px; font-weight: bold; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-nav">
            <a href="/">← Quay lại Menu</a>
            <span>Xin chào, {{ session.get('user') }}</span>
        </div>
        
        <h2>QUẢN LÝ & IN TEM PALLET</h2>
        
        <div class="controls">
            <select id="jobType">
                <option value="">-- Chọn Job Type --</option>
                {% for type in job_types %}
                <option value="{{ type }}">{{ type }}</option>
                {% endfor %}
            </select>
            <button class="btn-load" onclick="loadData()">Tải Dữ Liệu</button>
            <button class="btn-excel" onclick="exportExcel()">Xuất Excel</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 80px;">Pallet</th>
                    <th style="width: 100px;">Loại</th>
                    <th>Chi tiết SKU</th>
                    <th style="width: 80px;">Tem nhỏ</th>
                    <th style="width: 120px;">Job Scan</th>
                    <th style="width: 80px;">Tổng Thùng</th>
                    <th style="width: 80px;">Tổng KG</th>
                    <th style="width: 100px;">Trạng thái</th>
                    <th style="width: 100px;">Hành động</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="9">Vui lòng chọn Job Type và nhấn Tải Dữ Liệu</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Khu vực in ẩn -->
    <div id="printArea"></div>

    <script>
        function loadData() {
            const jobType = document.getElementById('jobType').value;
            if (!jobType) { alert("Vui lòng chọn Job Type!"); return; }
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="9">Đang tải dữ liệu...</td></tr>';

            fetch('/api/get_print_data', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({job_type: jobType})
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    renderTable(data.items);
                } else {
                    tbody.innerHTML = `<tr><td colspan="9" style="color:red">${data.message}</td></tr>`;
                }
            })
            .catch(err => tbody.innerHTML = `<tr><td colspan="9" style="color:red">Lỗi kết nối: ${err}</td></tr>`);
        }

        function renderTable(items) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            // Gom nhóm dữ liệu theo Pallet No
            const pallets = {};
            items.forEach(item => {
                if (!pallets[item.pallet_no]) {
                    let tare = 0;
                    const pt = String(item.pallet_type || '');
                    if (pt === '1.2') tare = 17;
                    else if (pt === '1.6') tare = 20;
                    else if (pt === '1.9' || pt === '1m9') tare = 25;

                    pallets[item.pallet_no] = {
                        pallet_no: item.pallet_no,
                        pallet_type: item.pallet_type,
                        jobscan: item.jobscan,
                        ship_to: item.ship_to,
                        skus: [],
                        master_add1: item.master_add1,
                        master_add2: item.master_add2,
                        master_add3: item.master_add3,
                        master_add4: item.master_add4,
                        master_delivery: item.master_delivery,
                        total_qty: 0,
                        tare_weight: tare,
                        net_weight: 0,
                        total_weight: tare,
                        has_tag_y: false
                    };
                }
                const p = pallets[item.pallet_no];
                const weight = (item.qty * item.sku_weight);
                p.skus.push({sku: item.sku, qty: item.qty, weight: weight, tag_label: item.tag_label});
                p.total_qty += item.qty;
                p.net_weight += weight;
                p.total_weight += weight;
                if (item.tag_label === 'Y') p.has_tag_y = true;
            });

            // Sắp xếp và hiển thị
            const sortedPallets = Object.values(pallets).sort((a,b) => parseInt(a.pallet_no) - parseInt(b.pallet_no));
            
            if (sortedPallets.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9">Không có dữ liệu pallet nào.</td></tr>';
                return;
            }

            sortedPallets.forEach(p => {
                const tr = document.createElement('tr');
                const skuDetails = p.skus.map(s => `<div><b>${s.sku}</b>: ${s.qty} ctns</div>`).join('');
                const statusHtml = p.jobscan ? '<span class="status-printed">Đã in</span>' : '<span class="status-pending">Chưa in</span>';
                const tagLabelHtml = p.has_tag_y ? '<span style="color:red; font-weight:bold;">Y</span>' : '';
                
                tr.innerHTML = `
                    <td><strong>${p.pallet_no}</strong></td>
                    <td>${p.pallet_type || ''}</td>
                    <td style="text-align: left;">${skuDetails}</td>
                    <td>${tagLabelHtml}</td>
                    <td>${p.jobscan || ''}</td>
                    <td>${p.total_qty}</td>
                    <td>${p.total_weight.toFixed(2)}</td>
                    <td>${statusHtml}</td>
                    <td>
                        <button class="btn-print" onclick='printLabel(${JSON.stringify(p)})'>In Tem</button>
                        <button class="btn-print" style="background-color: #6f42c1; margin-top: 5px;" onclick='printLabel150x100(${JSON.stringify(p)})'>In Tem 100x150</button>
                        <button class="btn-print" style="background-color: #28a745; margin-top: 5px;" onclick='printSSCC("${p.pallet_no}")'>In SSCC</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function printLabel(palletData) {
            updatePrintStyle('A4');
            const jobType = document.getElementById('jobType').value;
            let jobScan = palletData.jobscan;

            // Nếu chưa có JobScan, tạo mới và cập nhật server
            if (!jobScan) {
                const now = new Date();
                const fmt = n => n.toString().padStart(2, '0');
                jobScan = `${now.getFullYear()}${fmt(now.getMonth() + 1)}${fmt(now.getDate())}${fmt(now.getHours())}${fmt(now.getMinutes())}${fmt(now.getSeconds())}`;
                
                fetch('/api/update_jobscan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        job_type: jobType,
                        pallet_no: palletData.pallet_no,
                        jobscan: jobScan
                    })
                });
                // Cập nhật tạm thời để hiển thị ngay
                palletData.jobscan = jobScan;
            }

            const printArea = document.getElementById('printArea');
            
            // Tạo các dòng SKU cho bảng in
            let skuRows = palletData.skus.map((s, i) => {
                const note = s.tag_label === 'Y' ? 'Tem nhỏ' : '';
                return `
                <tr>
                    <td>${i+1}</td>
                    <td style="font-weight:bold">${s.sku}</td>
                    <td>${s.qty}</td>
                    <td>${s.weight.toFixed(2)}</td>
                    <td>${note}</td>
                </tr>
            `}).join('');

            // Nội dung tem in (100mm x 150mm)
            printArea.innerHTML = `
                <div class="label-box">
                    <div class="lbl-header">PALLET ID: ${palletData.pallet_no}</div>
                    
                    <div class="lbl-row">
                        <span><strong>Job:</strong> ${jobType}</span>
                        <span><strong>Loại:</strong> ${palletData.pallet_type || ''}</span>
                    </div>
                    
                    <div class="lbl-barcode">
                        <svg id="barcode"></svg>
                        <div style="font-size: 18px;">${jobScan}</div>
                    </div>
                    
                    <table class="lbl-table">
                        <thead>
                            <tr>
                                <th style="width: 30px;">#</th>
                                <th>SKU</th>
                                <th style="width: 50px;">Qty</th>
                                <th style="width: 80px;">KG</th>
                                <th>Ghi chú</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${skuRows}
                        </tbody>
                    </table>
                    
                    <div class="lbl-footer">
                        <div class="lbl-footer-row" style="font-size: 24px; margin-bottom: 10px;">
                            <span>Net: ${palletData.net_weight.toFixed(2)} KG</span>
                            <span>Tare: ${palletData.tare_weight} KG</span>
                        </div>
                        <div class="lbl-footer-row">
                            <span>Tổng: ${palletData.total_qty} ctns</span>
                            <span>Gross: ${palletData.total_weight.toFixed(2)} KG</span>
                        </div>
                    </div>
                </div>
            `;

            // Tạo mã vạch
            JsBarcode("#barcode", jobScan, {
                format: "CODE128",
                width: 3,
                height: 80,
                displayValue: false,
                margin: 0
            });

            // Gọi lệnh in
            window.print();
            
            // Tải lại dữ liệu sau khi in để cập nhật trạng thái "Đã in"
            setTimeout(loadData, 1000);
        }

        function printLabel150x100(palletData) {
            updatePrintStyle('100x150');
            const jobType = document.getElementById('jobType').value;
            let jobScan = palletData.jobscan;

            if (!jobScan) {
                const now = new Date();
                const fmt = n => n.toString().padStart(2, '0');
                jobScan = `${now.getFullYear()}${fmt(now.getMonth() + 1)}${fmt(now.getDate())}${fmt(now.getHours())}${fmt(now.getMinutes())}${fmt(now.getSeconds())}`;
                
                fetch('/api/update_jobscan', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        job_type: jobType,
                        pallet_no: palletData.pallet_no,
                        jobscan: jobScan
                    })
                });
                palletData.jobscan = jobScan;
            }

            const printArea = document.getElementById('printArea');
            
            let skuRows = palletData.skus.map((s, i) => `
                <tr>
                    <td>${i+1}</td>
                    <td style="font-weight:bold">${s.sku}</td>
                    <td>${s.qty}</td>
                </tr>
            `).join('');

            printArea.innerHTML = `
                <div class="label-box">
                    <!-- Row 1: Job & Pallet -->
                    <div style="display: flex; border-bottom: 1px solid #000; padding-bottom: 5px; margin-bottom: 5px; font-weight: bold">
                        <div style="width: 50%; border-right: 1px solid #000; padding-right: 5px; box-sizing: border-box;">
                            <span style="font-size: 12px;"><strong>FROM:</strong> </span>
                            <div style="font-size: 11px;">KLN ORDC#61</div>
                                                     
                        </div>
                        <div style="width: 50%; text-align: right; padding-left: 5px; box-sizing: border-box;">
                            <div style="font-size: 12px;"><strong>TO:</strong> ${palletData.ship_to}</div>
                            <div style="font-size: 11px;">
                                ${palletData.master_add1} ${palletData.master_add2} ${palletData.master_add3} ${palletData.master_add4}
                            </div>
                        </div>
                    </div>

                    <!-- Row 2: Type & Scan Text -->
                    <div style="display: flex; border-bottom: 1px solid #000; padding-bottom: 5px; margin-bottom: 5px;">
                        <div style="width: 50%; border-right: 1px solid #000; padding-right: 5px; box-sizing: border-box;">
                            <div style="font-size: 12px;"><strong>CUSTOMER:</strong></div>
                            <div style="font-size: 12px;"></div>
                        </div>
                        <div style="width: 50%; padding-left: 5px; box-sizing: border-box;">
                            <div style="font-size: 12px;"><strong>CARRIER:</strong></div><br>
                            <div style="font-size: 12px;">KLN LOGISTICS</div>
                        </div>
                    </div>

                    <!-- Row 3: PO -->
                    <div style="text-align: left; margin: 5px 0;">
                        <div style="font-weight: bold; font-size: 24px;">PO #:</div>
                        <div style="font-size: 60px; font-weight: bold; margin-top: 5px">${palletData.master_delivery}</div>
                    </div>

                    <!-- Row 4: SKU Table -->
                    <div style="flex-grow: 1;">
                        <table class="lbl-table" style="width: 100%; border-collapse: collapse; font-size: 12px;">
                            <thead>
                                <tr>
                                    <th style="border: 1px solid #000;">#</th>
                                    <th style="border: 1px solid #000;">SKU</th>
                                    <th style="border: 1px solid #000;">Qty</th>
                                </tr>
                            </thead>
                            <tbody>${skuRows}</tbody>
                        </table>
                    </div>

                    <!-- Row 5: Footer Weights -->
                    <div style="border-top: 2px solid #000; padding-top: 5px; margin-top: 5px; font-size: 14px; font-weight: bold;">
                        <div style="display: flex; justify-content: space-between;">
                            <span>Net: ${palletData.net_weight.toFixed(2)}</span>
                            <span>Tare: ${palletData.tare_weight}</span>
                        </div>
                        <div style="text-align: right; font-size: 16px; margin-top: 2px;">
                            Gross: ${palletData.total_weight.toFixed(2)} KG
                        </div>
                    </div>
                </div>
            `;

            window.print();
            setTimeout(loadData, 1000);
        }

        function printSSCC(palletNo) {
            updatePrintStyle('100x150');
            const jobType = document.getElementById('jobType').value;
            
            fetch('/api/get_sscc_data', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({job_type: jobType, pallet_no: palletNo})
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const printArea = document.getElementById('printArea');
                    printArea.innerHTML = '';
                    
                    data.items.forEach((item, index) => {
                        const div = document.createElement('div');
                        div.className = 'label-box';
                        div.style.pageBreakAfter = 'always'; // Ngắt trang sau mỗi tem
                        
                        div.innerHTML = `
                                                       
                            <div style="display: flex; border-bottom: 1px solid #000; padding-bottom: 5px; margin-bottom: 8px;">
                                <div style="font-size: 18px; width: 50%; border-right: 1px solid #000; padding-right: 5px; box-sizing: border-box;"><strong>FROM:</strong> KLN ORDC#61</div>
                                <div style="font-size: 18px; width: 50%; padding-left: 5px; box-sizing: border-box;">
                                    <strong>TO:</strong> ${item.ship_to || ''}
                                    <div style="font-size: 12px; font-weight: normal;">
                                        ${item.master_add1 || ''} ${item.master_add2 || ''} ${item.master_add3 || ''} ${item.master_add4 || ''} ${item.st_zip || ''}
                                    </div>
                                </div>
                            </div>
                            <div style="display: flex; border-bottom: 1px solid #000; padding-bottom: 5px; margin-bottom: 8px;">
                                <div style="font-size: 11px; width: 50%; border-right: 1px solid #000; padding-right: 5px; box-sizing: border-box;"><strong>CUSTOMER</strong> </div>
                                <div style="font-size: 11px; width: 50%; padding-left: 5px; box-sizing: border-box;"><strong>CARRIER</strong> KLN LOGISTICS </div>
                                
                            </div>

                            <div style="border-bottom: 1px solid #000; padding-bottom: 5px; margin-bottom: 8px;">
                                <strong>PO #:</strong> 
                                <div style="font-size: 48px; font-weight: bold; margin-top: 5px;">${item.master_delivery || ''}</div>
                                
                            </div>
                            <div style="display: flex; border-bottom: 1px solid #000; padding-bottom: 5px; margin-bottom: 8px;">
                                <div style="width: 50%; border-right: 1px solid #000; padding-right: 5px; box-sizing: border-box;">
                                    <strong>SKU:</strong> <div style="font-size: 30px; font-weight: bold;">${item.sku}</div>
                                    <div style="text-align: left;">
                                        <svg class="barcode-sku" 
                                            jsbarcode-value="${item.sku}" 
                                            jsbarcode-format="CODE128" 
                                            jsbarcode-width="2" 
                                            jsbarcode-height="50" 
                                            jsbarcode-displayValue="false">
                                        </svg>
                                    </div>
                                </div>
                                <div style="width: 50%; padding-left: 5px; box-sizing: border-box;">
                                    <strong>QTY:</strong> <div style="font-size: 30px; font-weight: bold;">${item.qty || ''}</div>
                                </div>
                            </div>

                            <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end;">
                                <div style="text-align: left;">
                                    <div style="font-size: 18px; margin-bottom: 5px;"><strong>SSCC:</strong></div>
                                    <svg class="barcode-sscc" 
                                        jsbarcode-value="${item.sscc}" 
                                        jsbarcode-format="CODE128" 
                                        jsbarcode-width="2" 
                                        jsbarcode-height="60" 
                                        jsbarcode-displayValue="true"
                                        jsbarcode-fontSize="14">
                                    </svg>
                                </div>
                            </div>
                            <div style="position: absolute; bottom: 10px; right: 10px; text-align: right;">
                                <div style="font-size: 10px; font-weight: bold;">${index + 1}/${data.items.length}</div>
                                <div style="font-size: 10px; font-weight: bold;">PALLET: ${item.pallet}</div>
                            </div>
                        `;
                        printArea.appendChild(div);
                    });
                    
                    JsBarcode(".barcode-sku").init();
                    JsBarcode(".barcode-sscc").init();
                    window.print();
                } else {
                    alert(data.message);
                }
            })
            .catch(err => alert('Lỗi: ' + err));
        }

        function exportExcel() {
            const jobType = document.getElementById('jobType').value;
            if(!jobType) { alert('Vui lòng chọn Job Type'); return; }
            window.location.href = `/export_pallet_data?job_type=${encodeURIComponent(jobType)}`;
        }

        function updatePrintStyle(type) {
            let style = document.getElementById('print-style-override');
            if (!style) {
                style = document.createElement('style');
                style.id = 'print-style-override';
                document.head.appendChild(style);
            }
            
            if (type === '100x150') {
                style.innerHTML = `
                    @media print {
                        @page { size: 100mm 150mm; margin: 0; }
                        #printArea { width: 100mm; }
                        .label-box { 
                            width: 100mm; height: 150mm; 
                            padding: 0mm; 
                            box-sizing: border-box;
                            border: 2px solid #000; 
                            font-family: Arial, sans-serif;
                            display: flex; flex-direction: column;
                            position: relative;
                        }
                    }
                `;
            } else {
                style.innerHTML = ''; // Reset to default (A4)
            }
        }
    </script>
</body>
</html>
