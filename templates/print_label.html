<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Tem & Thống Kê Pallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 1200px; margin-top: 30px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        .table th { background-color: #e9ecef; }
    </style>
    <!-- Thư viện in PDF -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body>
    <!-- Navbar đơn giản -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">HỆ THỐNG SCAN</a>
            <div class="d-flex">
                <a href="/notifications" class="btn btn-outline-light btn-sm me-2 position-relative">
                    <i class="bi bi-bell"></i> Lịch sử TB
                    <span id="notification-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"></span>
                </a>
                <a href="/" class="btn btn-outline-light btn-sm me-2">Quay lại Scan</a>
                <a href="/logout" class="btn btn-danger btn-sm">Đăng xuất</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 text-primary"><i class="bi bi-printer"></i> Thống Kê & In Tem Pallet</h4>
            </div>
            <div class="card-body">
                <!-- Khu vực chọn Job Type -->
                <div class="row mb-4 align-items-end">
                    <div class="col-md-5">
                        <label for="jobTypeSelect" class="form-label fw-bold">Chọn Job Type (Đã có Pallet):</label>
                        <select class="form-select form-select-lg" id="jobTypeSelect">
                            <option value="" selected disabled>-- Vui lòng chọn Job Type --</option>
                            {% for job in job_types %}
                            <option value="{{ job }}">{{ job }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label for="filterSelect" class="form-label fw-bold">Lọc loại tem:</label>
                        <select class="form-select form-select-lg" id="filterSelect">
                            <option value="all" selected>Tất cả</option>
                            <option value="normal">Tem Thường</option>
                            <option value="small">Tem Nhỏ</option>
                        </select>
                    </div>
                    <div class="col-md-4 text-end">
                        <button class="btn btn-success" id="refreshBtn" disabled>
                            <i class="bi bi-arrow-clockwise"></i> Tải lại dữ liệu
                        </button>
                    </div>
                </div>

                <!-- Bảng thống kê -->
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle text-center" id="palletTable">
                        <thead>
                            <tr>
                                <th style="width: 5%;">STT</th>
                                <th style="width: 10%;">Pallet No</th>
                                <th style="width: 10%;">Loại Pallet</th>
                                <th style="width: 20%;">Job Scan</th>
                                <th style="width: 10%;">Số lượng (SSCC)</th>
                                <th style="width: 15%;">Trọng lượng (Kg)</th>
                                <th style="width: 10%;">Ghi chú</th>
                                <th style="width: 10%;">Trạng thái</th>
                                <th style="width: 10%;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="9" class="text-muted py-4">Vui lòng chọn Job Type để xem dữ liệu</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Khu vực hiển thị thông báo (Toast) -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer" style="z-index: 1050;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const jobSelect = document.getElementById('jobTypeSelect');
        const filterSelect = document.getElementById('filterSelect');
        const tableBody = document.getElementById('tableBody');
        const refreshBtn = document.getElementById('refreshBtn');
        let currentData = []; // Biến toàn cục để lưu dữ liệu hiện tại

        function loadData() {
            const jobType = jobSelect.value;
            if (!jobType) return;

            tableBody.innerHTML = '<tr><td colspan="6" class="py-4"><div class="spinner-border text-primary" role="status"></div><div class="mt-2">Đang tải dữ liệu...</div></td></tr>';
            refreshBtn.disabled = true;

            fetch('/api/get_print_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ job_type: jobType })
            })
            .then(response => response.json())
            .then(data => {
                refreshBtn.disabled = false;
                if (data.success) {
                    currentData = data.items; // Lưu dữ liệu vào biến toàn cục
                    filterAndRender();
                } else {
                    tableBody.innerHTML = `<tr><td colspan="9" class="text-danger py-3">Lỗi: ${data.message}</td></tr>`;
                }
            })
            .catch(err => {
                refreshBtn.disabled = false;
                console.error(err);
                tableBody.innerHTML = '<tr><td colspan="9" class="text-danger py-3">Lỗi kết nối đến máy chủ</td></tr>';
            });
        }

        function filterAndRender() {
            const filterValue = filterSelect.value;
            let filteredItems = [...currentData];

            if (filterValue === 'normal') {
                filteredItems = filteredItems.filter(item => !item.has_small_label);
            } else if (filterValue === 'small') {
                filteredItems = filteredItems.filter(item => item.has_small_label);
            }
            renderTable(filteredItems);
        }

        function renderTable(items) {
            if (!items || items.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="9" class="text-muted py-3">Không tìm thấy dữ liệu pallet nào cho Job này.</td></tr>';
                return;
            }

            // Sắp xếp items theo tag_label (has_small_label) để gom nhóm
            items.sort((a, b) => {
                const labelA = a.has_small_label ? 1 : 0;
                const labelB = b.has_small_label ? 1 : 0;
                return labelA - labelB;
            });

            let html = '';
            let currentGroup = null;

            items.forEach((item, index) => {
                const originalIndex = currentData.indexOf(item);

                // Xác định nhóm và hiển thị header nếu thay đổi
                const groupName = item.has_small_label ? 'Tem Nhỏ' : 'Tem Thường';
                if (groupName !== currentGroup) {
                    currentGroup = groupName;
                    html += `<tr class="table-light"><td colspan="9" class="text-start fw-bold text-primary ps-4"><i class="bi bi-tags"></i> ${groupName}</td></tr>`;
                }

                // Tính tổng trọng lượng từ danh sách SKU trong pallet
                let totalWeight = 0;
                if (item.skus) {
                    item.skus.forEach(s => {
                        // s.qty là số lượng thùng, s.sku_weight là trọng lượng 1 thùng
                        totalWeight += (s.qty * (s.sku_weight || 0));
                    });
                }

                // Xác định trạng thái in
                const statusBadge = item.jobscan 
                    ? '<span class="badge bg-success">Đã in</span>' 
                    : '<span class="badge bg-warning text-dark">Chờ in</span>';

                const note = item.has_small_label ? '<span class="badge bg-info text-dark">Tem nhỏ</span>' : '';

                // Nút in SSCC chỉ hiện nếu không phải tem nhỏ (tag_label="N")
                const btnSSCC = !item.has_small_label ? `
                    <button class="btn btn-outline-dark btn-sm ms-1" onclick="printSSCCLabel(${originalIndex}, this)">
                        <i class="bi bi-upc-scan"></i> SSCC
                    </button>
                ` : '';

                // Nút in Tem Nhỏ chỉ hiện nếu là tem nhỏ (tag_label="Y")
                const btnSmallLabel = item.has_small_label ? `
                    <button class="btn btn-warning btn-sm ms-1" onclick="printSmallLabel(${originalIndex}, this)">
                        <i class="bi bi-tag"></i> Tem Nhỏ
                    </button>
                ` : '';

                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="fw-bold text-primary">${item.pallet_no}</td>
                        <td>${item.pallet_type || '-'}</td>
                        <td>${item.jobscan || ''}</td>
                        <td class="fw-bold">${item.qty}</td>
                        <td>${totalWeight.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        <td>${note}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="printLabel(${originalIndex})">
                                <i class="bi bi-printer"></i> In Tem
                            </button>
                            ${btnSSCC}
                            ${btnSmallLabel}
                        </td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;
        }

        function printLabel(index) {
            const item = currentData[index];
            if (!item) return;

            // --- Xử lý Jobscan tự động ---
            let jobScanToPrint = item.jobscan;
            let needUpdate = false;

            if (!jobScanToPrint || jobScanToPrint === 'PRINTED') {
                const now = new Date();
                const yyyy = now.getFullYear();
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                const hh = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                const ss = String(now.getSeconds()).padStart(2, '0');
                jobScanToPrint = `${yyyy}${mm}${dd}${hh}${min}${ss}`;
                needUpdate = true;
            }

            if (needUpdate) {
                // Cập nhật UI tạm thời
                item.jobscan = jobScanToPrint;
                
                // Gọi API cập nhật DB
                fetch('/api/update_jobscan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        job_type: jobSelect.value,
                        pallet_no: item.pallet_no,
                        jobscan: jobScanToPrint
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        renderTable(currentData); // Refresh bảng chính
                    }
                })
                .catch(console.error);
            }

            // 1. Tính toán trọng lượng
            let netWeight = 0; // Trọng lượng hàng
            let palletTare = 0; // Trọng lượng vỏ pallet

            // Tính Net Weight
            if (item.skus) {
                item.skus.forEach(s => {
                    netWeight += (s.qty * (s.sku_weight || 0));
                });
            }

            // Tính Pallet Tare Weight theo yêu cầu
            // Logic: 1.2 -> 17kg, 1.6 -> 22kg, 1.9 -> 25kg
            const pType = String(item.pallet_type || '');
            if (pType.includes('1.2')) {
                palletTare = 17;
            } else if (pType.includes('1.6')) {
                palletTare = 22;
            } else if (pType.includes('1.9')) {
                palletTare = 25;
            } else {
                // Mặc định nếu không khớp (hoặc có thể để 0)
                palletTare = 0; 
            }

            const grossWeight = netWeight + palletTare;

            // 2. Tạo nội dung HTML để in
            // Tạo barcode dạng base64 image
            let barcodeImg = '';
            if (jobScanToPrint) {
                try {
                    const canvas = document.createElement("canvas");
                    JsBarcode(canvas, jobScanToPrint, {
                        format: "CODE128",
                        displayValue: true,
                        fontSize: 18,
                        margin: 10
                    });
                    barcodeImg = canvas.toDataURL("image/png");
                } catch (e) {
                    console.error("Lỗi tạo barcode:", e);
                }
            }

            // Tạo cửa sổ in mới
            const printWindow = window.open('', '_blank');
            
            // Xử lý cột Ghi chú (Tem nhỏ)

            let skuRows = '';
            item.skus.forEach((s, i) => {
                const noteCell = `<td>${s.tag_label === 'Y' ? 'Tem nhỏ' : 'Tem thường'}</td>`;
                skuRows += `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${s.sku}</td>
                        <td>${s.qty}</td>
                        <td>${(s.sku_weight || 0).toFixed(2)}</td>
                        <td>${(s.qty * (s.sku_weight || 0)).toFixed(2)}</td>
                        ${noteCell}
                    </tr>
                `;
            });

            const tableHeader = `
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>SKU</th>
                        <th>Số lượng (Thùng)</th>
                        <th> Số kg trong 1 thùng(Kg)</th>
                        <th>Tổng trọng lượng(Kg)</th>
                        <th>Ghi chú</th>
                    </tr>
                </thead>
            `;

            const htmlContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Print Label - ${item.pallet_no}</title>
                    <style>
                        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
                        .header { text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 30px; border-bottom: 2px solid #333; padding-bottom: 10px; position: relative; }
                        .header-right { position: absolute; top: 0; right: 0; font-size: 14px; font-weight: normal; text-align: right; }
                        .info-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 16px; }
                        .info-row strong { font-size: 18px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; margin-bottom: 20px; }
                        th, td { border: 1px solid #000; padding: 10px; text-align: center; }
                        th { background-color: #f2f2f2; }
                        .footer { margin-top: 30px; font-size: 16px; border-top: 2px solid #333; padding-top: 20px; }
                        .footer-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
                        .gross-weight { font-size: 20px; font-weight: bold; margin-top: 15px; }
                        .barcode-container { text-align: center; margin-top: 40px; }
                        img { max-width: 100%; height: auto; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        PALLET LABEL
                        
                    </div>
                    
                    <div class="info-row">
                        <span>Job No: <strong>${jobSelect.value}</strong></span>
                        <span>Date: ${new Date().toLocaleDateString('en-GB')}</span>
                    </div>
                    <div class="info-row">
                        <span>Pallet No: <strong>${item.pallet_no}</strong></span>
                        <span>Type: ${item.pallet_type || 'N/A'}</span>
                    </div>

                    <table>
                        ${tableHeader}
                        <tbody>
                            ${skuRows}
                        </tbody>
                    </table>

                    <div class="footer">
                        <div class="footer-row">
                            <span>Total Quantity (Box):</span>
                            <strong>${item.qty}</strong>
                        </div>
                        <div class="footer-row">
                            <span>Net Weight:</span>
                            <strong>${netWeight.toFixed(2)} Kg</strong>
                        </div>
                        <div class="footer-row">
                            <span>Pallet Weight (Tare):</span>
                            <strong>${palletTare} Kg</strong>
                        </div>
                        <div class="footer-row gross-weight">
                            <span>GROSS WEIGHT:</span>
                            <span>${grossWeight.toFixed(2)} Kg</span>
                        </div>
                    </div>

                    <div class="barcode-container">
                        ${barcodeImg ? `<img src="${barcodeImg}" />` : ''}
                        ${!barcodeImg && jobScanToPrint ? `<div>Job Scan: ${jobScanToPrint}</div>` : ''}
                    </div>

                    <script>
                        window.onload = function() {
                            window.print();
                        }
                    <\/script>
                </body>
                </html>
            `;

            printWindow.document.write(htmlContent);
            printWindow.document.close();
        }

        function printSSCCLabel(index, btn) {
            const item = currentData[index];
            if (!item) return;

            // Hiển thị loading spinner
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';
            btn.disabled = true;

            // Gọi API lấy danh sách chi tiết SSCC trong pallet
            fetch('/api/get_sscc_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    job_type: jobSelect.value,
                    pallet_no: item.pallet_no
                })
            })
            .then(res => res.json())
            .then(data => {
                // Khôi phục trạng thái nút
                btn.innerHTML = originalContent;
                btn.disabled = false;

                if (data.success) {
                    let ssccItems = data.items || [];
                    // Lọc SSCC theo loại tem của nhóm hiện tại (Tem Thường)
                    ssccItems = ssccItems.filter(x => x.tag_label !== 'Y');

                    if (ssccItems.length > 0) {
                        printMultipleSSCCLabels(item, ssccItems);
                    } else {
                        alert('Không tìm thấy dữ liệu SSCC phù hợp cho nhóm này.');
                    }
                } else {
                    alert('Lỗi Server: ' + (data.message || 'Không lấy được dữ liệu.'));
                }
            })
            .catch(err => {
                // Khôi phục trạng thái nút khi lỗi
                btn.innerHTML = originalContent;
                btn.disabled = false;

                console.error(err);
                alert('Lỗi kết nối: ' + err.message);
            });
        }

        function printSmallLabel(index, btn) {
            const item = currentData[index];
            if (!item) return;

            // Hiển thị loading spinner
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';
            btn.disabled = true;

            // Gọi API lấy danh sách chi tiết SSCC trong pallet
            fetch('/api/get_sscc_data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    job_type: jobSelect.value,
                    pallet_no: item.pallet_no
                })
            })
            .then(res => res.json())
            .then(data => {
                // Khôi phục trạng thái nút
                btn.innerHTML = originalContent;
                btn.disabled = false;

                if (data.success) {
                    let ssccItems = data.items || [];
                    // Lọc SSCC chỉ lấy Tem Nhỏ
                    ssccItems = ssccItems.filter(x => x.tag_label === 'Y');

                    if (ssccItems.length > 0) {
                        printMultipleSmallLabels(item, ssccItems);
                    } else {
                        alert('Không tìm thấy dữ liệu Tem Nhỏ.');
                    }
                } else {
                    alert('Lỗi Server: ' + (data.message || 'Không lấy được dữ liệu.'));
                }
            })
            .catch(err => {
                // Khôi phục trạng thái nút khi lỗi
                btn.innerHTML = originalContent;
                btn.disabled = false;

                console.error(err);
                alert('Lỗi kết nối: ' + err.message);
            });
        }

        function printMultipleSSCCLabels(palletInfo, ssccItems) {
            const printWindow = window.open('', '_blank');
            
            // Tạo HTML cho từng tem
            const labelsHtml = ssccItems.map((ssccItem, index) => {
                const fromAddr = [ssccItem.ship_to,ssccItem.master_add1, ssccItem.master_add2, ssccItem.master_add3, ssccItem.master_add4, ssccItem.st_zip].filter(Boolean).join(', ');
                const toAddr = [ ssccItem.master_delivery].filter(Boolean).join(', ');
                const ssccCode = ssccItem.sscc || ssccItem.barcode || ''; 

                return `
                    <div class="label-page">
                        <div class="row" style="height: 30mm;">
                            <div class="col">
                                <div class="label-title">FROM</div>
                                <div class="label-content">KLN ORDC#61</div>
                            </div>
                            <div class="col">
                                <div class="label-title">TO</div>
                                <div class="label-content">${fromAddr}</div>
                            </div>
                        </div>
                        <div class="row" style="height: 10mm;">
                            <div class="col">
                                <div class="label-title">CUSTOMER</div>
                                <div class="label-content"></div>
                            </div>
                            <div class="col">
                                <div class="label-title">CARRIER</div>
                                <div class="label-content">KLN Logistics</div>
                            </div>
                        </div>
                        <div class="po-section">
                            <div class="label-title_PO">PO</div>
                            <div class="label-content_PO">${toAddr}</div>
                        </div>
                        <div class="sku-section">
                            <table>
                                <thead><tr><th>SKU</th><th>Quantity</th></tr></thead>
                                <tbody>
                                    <tr>
                                        <td class="SKU-cell">
                                            ${ssccItem.sku}
                                            <br>
                                            <svg class="barcode"
                                                jsbarcode-format="CODE128"
                                                jsbarcode-value="${ssccItem.sku}"
                                                jsbarcode-height="50"
                                                jsbarcode-displayValue="false">
                                            </svg>
                                        </td>
                                        <td>${ssccItem.qty}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="sscc-section">
                            <div class="label-title" style="margin-bottom: 5px;">SSCC</div>
                            <svg class="barcode"
                                jsbarcode-format="CODE128"
                                jsbarcode-value="${ssccCode}"
                                jsbarcode-textmargin="0"
                                jsbarcode-fontoptions="bold"
                                jsbarcode-height="50"
                                jsbarcode-displayValue="false"
                                jsbarcode-fontSize="24">
                            </svg>
                        <div style="margin-top: 5px; font-weight: normal; font-size: 12px; text-align: left;">${ssccCode}</div>
                       <div style="display: flex; justify-content: space-between; font-size: 8px; padding: 0 5px;text-align: left; margin-top: 10px;">
                            <strong>Pallet: ${palletInfo.pallet_no}</strong>
                            <strong> Page ${index + 1}/${ssccItems.length}</strong>
                        </div>
                        </div>
                    </div>
                `;
            }).join('');

            const htmlContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>SSCC Label - ${palletInfo.pallet_no}</title>
                    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>
                    <style>
                        @page { size: 100mm 150mm; margin: 0; }
                        body { margin: 0; font-family: Arial, sans-serif; background: #ccc; }
                        .label-page {
                            width: 100mm; height: 148mm; 
                            background: white;
                            border: 1px solid black; box-sizing: border-box;
                            display: flex; flex-direction: column;
                            page-break-after: always;
                            margin: 10px auto; 
                        }
                        .label-page:last-child { page-break-after: auto; }
                        
                        .row { display: flex; border-bottom: 1px solid black; }
                        .col { flex: 1; padding: 5px; border-right: 1px solid black; overflow: hidden; }
                        .col:last-child { border-right: none; }
                        .label-title { font-size: 10px; color: #333; margin-bottom: 4px; text-transform: uppercase; font-weight: bold; }
                        .label-content { font-weight: bold; font-size: 12px; word-wrap: break-word; line-height: 1.2; }
                        .label-title_PO { font-size: 10px; color: #333; margin-bottom: 4px; text-transform: uppercase; font-weight: bold; }
                        .label-content_PO { font-weight: bold; font-size: 50px; word-wrap: break-word; line-height: 1.2; }
                        .po-section { padding: 5px; border-bottom: 1px solid black; }
                        .sku-section { padding: 5px; border-bottom: 1px solid black; flex-grow: 1; }
                        .sscc-section { text-align: center; padding: 10px; margin-top: auto; }
                        .sscc-section .label-title { font-size: 10px; color: #333; margin-bottom: 4px; text-transform: uppercase; font-weight: bold;text-align: left; }
                        .SKU-cell { text-align: left; font-weight: bold;font-size: 30px; }
                        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
                        th, td { border: 1px solid #ccc; padding: 6px; text-align: center; font-size: 12px; }
                        
                        @media print {
                            body { background: none; }
                            .label-page { border: none; margin: 0; height: 150mm; }
                        }
                    </style>
                </head>
                <body>
                    ${labelsHtml}
                    <script>
                        window.onload = function() {
                            JsBarcode(".barcode").init();
                            setTimeout(() => {
                                window.print();
                            }, 500);
                        }
                    <\/script>
                </body>
                </html>
            `;
            printWindow.document.write(htmlContent);
            printWindow.document.close();
        }

        function printMultipleSmallLabels(palletInfo, ssccItems) {
            const printWindow = window.open('', '_blank');
            
            const labelsHtml = ssccItems.map((ssccItem, index) => {
                const ssccCode = ssccItem.sscc || ssccItem.barcode || ''; 
                const po = jobSelect.value;

                return `
                    <div class="label-page">
                        
                        <table class="info-table">
                            <tr>
                                <td><strong>SSCC:</strong></td>
                                <td><strong>PO:</strong> ${ssccItem.master_delivery}</td>
                                <td><strong>SKU:</strong> ${ssccItem.sku}</td>
                                <td><strong>Quantity:</strong> ${ssccItem.qty}</td>
                            </tr>
                        </table>
                        <div class="barcode-container">
                            <svg class="barcode"
                                jsbarcode-format="CODE128"
                                jsbarcode-value="${ssccCode}"
                                jsbarcode-textmargin="0"
                                jsbarcode-fontoptions="bold"
                                jsbarcode-height="40"
                                jsbarcode-displayValue="false"
                                jsbarcode-width="1.5"
                                jsbarcode-margin="0">
                            </svg>
                            <div style="margin-top: 5px; font-weight: normal; font-size: 12px; text-align: left;">${ssccCode}</div>
                        </div>
                    </div>
                `;
            }).join('');

            const htmlContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Small Labels - ${palletInfo.pallet_no}</title>
                    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>
                    <style>
                        @page { size: 100mm 30mm; margin: 0; }
                        body { margin: 0; font-family: Arial, sans-serif; background: #ccc; }
                        .label-page {
                            width: 100mm; height: 30mm;
                            background: white;
                            box-sizing: border-box;
                            display: flex; flex-direction: column;
                            page-break-after: always;
                            margin: 5px auto; 
                            padding: 2px 5px;
                            overflow: hidden;
                        }
                        .label-page:last-child { page-break-after: auto; }
                        
                        .info-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 2px; }
                        .info-table td { padding: 1px 5px; white-space: nowrap; }
                        
                        .barcode-container { text-align: center; margin-top: auto; overflow: hidden; }
                        svg.barcode { max-width: 100%; height: auto; }

                        @media print {
                            body { background: none; }
                            .label-page { margin: 0; border: none; height: 30mm; page-break-after: always; }
                        }
                    </style>
                </head>
                <body>
                    ${labelsHtml}
                    <script>
                        window.onload = function() {
                            JsBarcode(".barcode").init();
                            setTimeout(() => {
                                window.print();
                            }, 500);
                        }
                    <\/script>
                </body>
                </html>
            `;
            printWindow.document.write(htmlContent);
            printWindow.document.close();
        }

        // Sự kiện khi thay đổi combobox
        jobSelect.addEventListener('change', loadData);
        filterSelect.addEventListener('change', filterAndRender);
        
        // Sự kiện nút refresh
        refreshBtn.addEventListener('click', loadData);

        // --- Logic hiển thị thông báo từ Scanner ---
        const toastContainer = document.getElementById('toastContainer');
        const notificationBadge = document.getElementById('notification-badge');

        function fetchLogs() {
            fetch('/api/get_logs')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.logs) {
                        data.logs.forEach(log => {
                            if (!log.is_read) {
                                createToast(log);
                                markLogAsRead(log.id);
                            }
                        });
                    }
                })
                .catch(err => console.error('Lỗi lấy log:', err));
        }

        function createToast(log) {
            const toastId = 'toast-' + log.id;
            const html = `
                <div id="${toastId}" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header bg-primary text-white">
                        <strong class="me-auto"><i class="bi bi-bell-fill"></i> Thông báo Scanner</strong>
                        <small>${log.created_at}</small>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body">
                        <strong>${log.username}:</strong> ${log.message}
                    </div>
                </div>
            `;
            toastContainer.insertAdjacentHTML('beforeend', html);
            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement, { delay: 10000 }); // Hiện 10 giây
            toast.show();
            
            // Xóa khỏi DOM sau khi ẩn để tránh rác
            toastElement.addEventListener('hidden.bs.toast', () => {
                toastElement.remove();
            });
        }

        function markLogAsRead(id) {
            fetch('/api/mark_read', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id })
            }).catch(console.error);
        }

        function updateNotificationBadge() {
            fetch('/api/unread_count')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.count > 0) {
                        notificationBadge.textContent = data.count > 99 ? '99+' : data.count;
                        notificationBadge.classList.remove('d-none');
                    } else {
                        notificationBadge.classList.add('d-none');
                    }
                })
                .catch(err => console.error('Lỗi kiểm tra thông báo mới:', err));
        }

        // Kiểm tra thông báo (toast) mỗi 3 giây
        setInterval(fetchLogs, 3000);

        // Kiểm tra trạng thái (badge) mỗi 10 giây
        setInterval(updateNotificationBadge, 10000);

        // Kiểm tra ngay khi tải trang
        fetchLogs();
        updateNotificationBadge();
    </script>
</body>
</html>
